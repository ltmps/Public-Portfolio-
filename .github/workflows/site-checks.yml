name: Portfolio checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  static-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-site.cjs
      - run: node scripts/check-easymini-trace.cjs
      - run: node scripts/check-singularity-gallery.cjs
      - run: node scripts/check-modeling-media.cjs
      - run: node scripts/check-fan-simscape.cjs
      - run: node scripts/check-supervisor-review.cjs
      - run: node scripts/check-mpc-replay.cjs
      - run: node scripts/check-reaction-wheel-locus.cjs
      - run: node scripts/check-sherpa-missions.cjs
      - run: node scripts/check-sherpa-training.cjs
      - run: node scripts/check-sherpa-navigation.cjs
      - name: JavaScript syntax
        run: |
          node --check assets/js/gy.js
          node --check assets/js/easymini-trace.js
          node --check assets/js/reaction-wheel-locus.js
          node --check assets/js/gy-mesh.js
          node --check assets/js/mission-studies.js
          node --check assets/js/architecture-study.js
          node --check assets/js/sherpa-missions.js
          node --check assets/js/sherpa-strips.js
          node --check assets/js/sherpa-inline.js
          node --check assets/js/sherpa-training.js
          node --check assets/js/ir-track.js
          node --check assets/js/gy-replay.js
          node --check assets/js/gy-bar.js
          node --check assets/js/gy-read.js
          node --check assets/js/khorium-anim.js
