<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">ORBES attitude controller signal flow</title><desc id="desc">Attitude and rate references are compared with measured motion. Filtered errors enter digital PID feedback. Feedforward torque is added, then wheel-axis mapping and actuator limits command the coupled spacecraft. Accepted torque returns to the integral anti-windup path; measured state returns to the error calculation and feedforward.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#202020"/></marker></defs>
<rect width="1200" height="520" fill="#fff"/>
<g font-family="Arial,sans-serif" fill="#161616" text-anchor="middle"><text x="600" y="32" font-size="23" font-weight="bold">PID feedback + model-based feedforward</text></g>
<g fill="#f5f5f5" stroke="#202020" stroke-width="2"><rect x="20" y="210" width="150" height="90"/><rect x="210" y="210" width="140" height="90"/><rect x="390" y="210" width="140" height="90"/><rect x="570" y="210" width="145" height="90"/><rect x="390" y="80" width="325" height="75"/><circle cx="770" cy="255" r="20" fill="#fff"/><rect x="825" y="210" width="155" height="90"/><rect x="1020" y="210" width="160" height="90"/></g>
<g font-family="Arial,sans-serif" font-size="17" fill="#161616" text-anchor="middle"><text x="95" y="240">Reference</text><text x="95" y="265">attitude + rate</text><text x="280" y="238">Body-frame</text><text x="280" y="262">attitude / rate</text><text x="280" y="285">errors</text><text x="460" y="238">20 Hz filter</text><text x="460" y="264">then sample</text><text x="460" y="287">at 100 Hz</text><text x="642" y="240">Digital PID</text><text x="642" y="266">Kp e + Kd eω</text><text x="642" y="288">+ integral state</text><text x="553" y="108">Acceleration + coupling feedforward</text><text x="553" y="135">reference motion and body state</text><text x="770" y="262" font-size="25">+</text><text x="902" y="236">Wheel mapping</text><text x="902" y="262">torque limits</text><text x="902" y="287">+ speed guard</text><text x="1100" y="237">Reaction wheels</text><text x="1100" y="263">+ coupled</text><text x="1100" y="287">spacecraft</text></g>
<g fill="none" stroke="#202020" stroke-width="2" marker-end="url(#arrow)"><path d="M170 255H210"/><path d="M350 255H390"/><path d="M530 255H570"/><path d="M715 255H750"/><path d="M790 255H825"/><path d="M980 255H1020"/><path d="M95 210V118H390"/><path d="M715 118H770V235"/><path d="M1100 300V450H280V300"/><path d="M1145 210V55H553V80" stroke-dasharray="6 5"/><path d="M902 300V370H642V300" stroke="#c43d00"/></g>
<g font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><text x="760" y="360" fill="#9c3100">Accepted − requested body torque</text><text x="760" y="393" fill="#9c3100">anti-windup → integral update</text><text x="620" y="440" fill="#161616">Measured attitude and angular rate → error calculation</text><text x="930" y="76" fill="#161616">Body state / wheel momentum</text><text x="600" y="493" fill="#555">Signal-flow summary · saved controller settings · nonlinear multibody plant</text></g>
</svg>
